name: Feature request
description: Propose a new requirement or a change to an existing PRD
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed requirement
      description: Testable requirements (R1, R2, ...) and acceptance criteria, following docs/prd/_template.md.
    validations:
      required: true
  - type: input
    id: prd
    attributes:
      label: Existing PRD affected
      description: Leave blank if this needs a new PRD.
      placeholder: e.g. docs/prd/calendar-views.md
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
